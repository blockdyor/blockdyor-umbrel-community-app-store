version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: blockdyor-bassin_ui_1
      APP_PORT: 8080
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /sv2
        chmod 700 /sv2
        chown 1000:1000 /config /sv2
        if [ -f /config/ckpool.conf ]; then
          chown 1000:1000 /config/ckpool.conf
          exit 0
        fi
        apk add --no-cache envsubst
        tmp=$$(mktemp /config/.ckpool.conf.XXXXXX)
        trap 'rm -f "$$tmp"' EXIT
        envsubst < /config/ckpool.conf.template > "$$tmp"
        chown 1000:1000 "$$tmp"
        chmod 600 "$$tmp"
        ln -T "$$tmp" /config/ckpool.conf
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/sv2:/sv2
    environment:
      - APP_BITCOIN_NODE_IP=${APP_BITCOIN_NODE_IP}
      - APP_BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - APP_BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - APP_BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - APP_BITCOIN_ZMQ_HASHBLOCK_PORT=${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
  ckpool:
    image: ghcr.io/blockdyor/docker-ckpool-solo:v1.2.0-2@sha256:9a17c69583798c0ea4d79f754e7bb4298ee3dfe848a1bd5f2136ad2adf0d98b4
    entrypoint: ["/bin/sh", "/opt/bassin/ckpool-start.sh", "-k", "-B", "-c", "/config/ckpool.conf"]
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "3456:3333/tcp"
      - "3457:3336/tcp"
      - "3458:3337/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/sv2:/sv2
      - ${APP_DATA_DIR}/data/www:/www
      - ${APP_DATA_DIR}/hooks/ckpool-start.sh:/opt/bassin/ckpool-start.sh:ro
  ui:
    image: ghcr.io/blockdyor/bassin-ui:292838b@sha256:07e050a85c070418b75fda7bc04492b6f75f2e6f3983f80221acc055dfbc9c9e
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/www:/www
    restart: on-failure
  widget-server:
    image: ghcr.io/blockdyor/umbrel-bassin-widget:main@sha256:0f2b9d16a709aecc09b6b1901e037587738a9706f633cdf824b298129f6b994b
    environment:
      - BASSIN_API_POOL_URL=http://blockdyor-bassin_ui_1:8080/pool/pool.status
    depends_on:
      - ui
    restart: on-failure
