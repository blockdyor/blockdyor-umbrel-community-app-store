manifestVersion: 1
version: "2.1.22"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  Run a Bitcoin solo mining pool on your Umbrel with no pool fee. Shares track your miners' work; they do not earn regular payouts.


  Keep Umbrel's Bitcoin Node app running and fully synchronized. After installing Bassin, open Connect for Stratum V1 (port 3456) details. Optional Noise-encrypted Stratum V2 (port 3457) and Job Declaration (port 3458, with Bitcoin Core's IPC Mining Interface) can be enabled from Settings → Stratum V2. Use your own Bitcoin receiving address followed by a dot and a worker name as the miner username, and x as the password.


  Already running Bassin from the official store? Back up its data and stop it before switching. The two apps use separate data directories but need the same Stratum ports. See https://github.com/blockdyor/bassin/blob/main/docs/getting-started.md


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Smaller and faster Bassin UI and CKPool v1.2.0-5.


  - Pre-compressed static gzip assets with immutable browser caching for hashed JS/CSS bundles
  - Lazy-loads the 3D globe asynchronously so the Home dashboard paints immediately
  - Replaces the 121 MiB offline GeoIP MMDB + C library with a compact 51.4 MiB pure-Python binary lookup table (zero persistent RAM, zero external requests)
  - Removes unused fonts, favicons, UI components, dependencies, and redundant GeoJSON metadata (static bundle reduced from 4.5 MiB to 3.4 MiB)
  - Compiles CKPool v1.2.0-5 with portable -O3 and LTO (-flto=auto) for faster share and Stratum processing


  Full changelog: https://github.com/blockdyor/bassin/blob/main/docs/whats-new.md
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/5938
icon: https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
deterministicPassword: true
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
  - id: "workers-leaderboard"
    type: "list"
    refresh: "30s"
    endpoint: "ui:8080/widgets/workers"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "#1 nerdqaxe"
          subtext: "Best ever: 2.5T · 4.80 Th/s"
        - text: "#2 bitaxe-gamma"
          subtext: "Best ever: 147M · 1.20 Th/s"
        - text: "#3 bitaxe-ultra"
          subtext: "Best ever: 17.4M · 555 Gh/s"
  - id: "hashrate"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/hashrate"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "1m Avg"
          text: "2.15"
          subtext: "Th/s"
        - title: "5m Avg"
          text: "2.10"
          subtext: "Th/s"
        - title: "1h Avg"
          text: "2.05"
          subtext: "Th/s"
        - title: "24h Avg"
          text: "1.98"
          subtext: "Th/s"
