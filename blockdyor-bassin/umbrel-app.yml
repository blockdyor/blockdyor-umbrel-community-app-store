manifestVersion: 1
version: "2.1.16"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  Run a Bitcoin solo mining pool on your Umbrel with no pool fee. Shares track your miners' work; they do not earn regular payouts.


  Keep Umbrel's Bitcoin Node app running and fully synchronized. After installing Bassin, open Connect → Worker Setup for the Stratum address (port 3456). Use your own Bitcoin receiving address followed by a dot and a worker name as the miner username. Use x as the password.


  Already running Bassin from the official store? Back up its data and stop it before switching. The two apps use separate data directories but need the same Stratum port. See https://github.com/blockdyor/bassin/blob/main/docs/getting-started.md


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin 2.1.16 cuts RAM usage across the entire stack and adds new umbrelOS
  dashboard widgets, including a Worker Best Diff Leaderboard!


  - Lower RAM everywhere: removes the separate widget-server container (~50 MB
    RAM saved; Bassin now runs just ckpool + ui), serves widgets directly from
    local disk inside ui:8080 with 256 KiB thread stacks, 15s keep-alive timeouts,
    and python3 -O -B, caps glibc malloc arenas on ckpool (MALLOC_ARENA_MAX=2),
    and splits the frontend into lazy-loaded chunks (705 kB core shell; Settings
    loads only 51 kB without parsing Three.js or Recharts).
  - Three umbrelOS widgets: Pool Overview (now with scientific-notation hashrate
    and stale-status fixes), Worker Best Diff Leaderboard (ranks workers by
    all-time best share difficulty found ever), and Hashrate Averages (1m/5m/1h/24h).
  - Includes 2.1.15 live auto-saving Settings, automatic CKPool reloads,
    Noise-encrypted Stratum V2, Umbrel proxy auth, full compatibility with both
    Bitcoin Core and Bitcoin Knots, and SonarCloud A security rating (0 issues).
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/5938
icon: https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
  - id: "workers-leaderboard"
    type: "list"
    refresh: "30s"
    endpoint: "ui:8080/widgets/workers"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "#1 nerdqaxe"
          subtext: "Best ever: 2.5T · 4.80 Th/s"
        - text: "#2 bitaxe-gamma"
          subtext: "Best ever: 147M · 1.20 Th/s"
        - text: "#3 bitaxe-ultra"
          subtext: "Best ever: 17.4M · 555 Gh/s"
  - id: "hashrate"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/hashrate"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "1m Avg"
          text: "2.15"
          subtext: "Th/s"
        - title: "5m Avg"
          text: "2.10"
          subtext: "Th/s"
        - title: "1h Avg"
          text: "2.05"
          subtext: "Th/s"
        - title: "24h Avg"
          text: "1.98"
          subtext: "Th/s"
