manifestVersion: 1
version: "2.1.9"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Improve mobile stability by releasing globe graphics resources when leaving Home,
  reducing graphics load on touch devices, and showing a static globe if graphics are interrupted.
  Fix clipped share-quality labels on small phones. Restore the larger, lighter version text
  with natural spacing between Bassin and CKPool. Worker Setup now explains that the successful
  miner receives the full block reward, including transaction fees, with no pool commission.
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/5938
icon: https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
