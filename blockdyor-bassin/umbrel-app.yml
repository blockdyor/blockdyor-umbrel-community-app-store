manifestVersion: 1
version: "1.0.4"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel, featuring the latest
  ckPool (v1.1.1). Run your own ckPool at home.


  Make sure your Bitcoin Node is fully synced, then install and follow
  the on-screen instructions.


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Updated ckpool to v1.1.1, built from a verified source
  (ghcr.io/blockdyor/docker-ckpool-solo).


  Replaced an unsafe HTML-injection pattern in the UI's number
  formatting with safe React rendering. No visual or functional
  change, purely a hardening fix.
  

  Added a copy-to-clipboard button next to the stratum host on the
  onboarding screen, so you can grab it without selecting the text
  by hand.
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
icon: https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
