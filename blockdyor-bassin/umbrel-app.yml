manifestVersion: 1
version: "2.1.14"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  Run a Bitcoin solo mining pool on your Umbrel with no pool fee. Shares track your miners' work; they do not earn regular payouts.


  Keep Umbrel's Bitcoin Node app running and fully synchronized. After installing Bassin, open Connect → Worker Setup for the Stratum address (port 3456). Use your own Bitcoin receiving address followed by a dot and a worker name as the miner username. Use x as the password.


  Already running Bassin from the official store? Back up its data and stop it before switching. The two apps use separate data directories but need the same Stratum port. See https://github.com/blockdyor/bassin/blob/main/docs/getting-started.md


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Adds Noise-encrypted Stratum V2 support and updates CKPool to upstream revision
  be3e1e07 (docker-ckpool-solo v1.2.0-2) with 90 upstream fixes including
  multi-node block submission retries, workbase-matched network difficulty checks,
  escaped RPC address validation, startup hashrate decay fixes, and optional
  Mining IPC support. Standard JSON-RPC + ZMQ remains the default so Bitcoin Knots
  29.3 and all Bitcoin Core versions continue working out of the box.


  Bassin UI 2.1.14 adds a Connect → Stratum V2 tab with QR code and auto-detected
  Base58Check authority public key (private keys stay in the dedicated /sv2 mount),
  Stratum V2 & Job Declaration telemetry in Insights, a dedicated Settings → Stratum V2
  tab, and full CKPool configuration controls across Mining, Bitcoin Node, and Advanced.
  Exposes host ports 3457 (SV2 Mining) and 3458 (SV2 Job Declaration) alongside 3456 (SV1).
  Existing configurations and mining data are preserved.
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/5938
icon: https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
