manifestVersion: 1
version: "2.1.17"
id: blockdyor-bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  Run a Bitcoin solo mining pool on your Umbrel with no pool fee. Shares track your miners' work; they do not earn regular payouts.


  Keep Umbrel's Bitcoin Node app running and fully synchronized. After installing Bassin, open Connect → Worker Setup for the Stratum address (port 3456). Use your own Bitcoin receiving address followed by a dot and a worker name as the miner username. Use x as the password.


  Already running Bassin from the official store? Back up its data and stop it before switching. The two apps use separate data directories but need the same Stratum port. See https://github.com/blockdyor/bassin/blob/main/docs/getting-started.md


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin 2.1.17 adds native Bitcoin Core v32+ IPC mining support and hardens the
  Config API for safe use with active miners and paid hashrate rentals!


  - Bitcoin Core IPC mining: mounts ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro read-only
    on ckpool (never on ui), sets ipcmining to /bitcoin/${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH:-node.sock}
    on fresh installs with RPC + ZMQ fallback intact, and waits up to 30s at startup
    only when APP_BITCOIN_IPC_ENABLED=true so node.sock is ready before CKPool's
    startup check (zero delay on Bitcoin Knots or non-IPC nodes).
  - Hardened Config API: requires a per-app Bearer token (BASSIN_CONFIG_TOKEN
    backed by Umbrel's deterministic app password) inside the Docker network,
    enforces a strict key allowlist blocking donation, btcaddress, logdir, proxy,
    and redirecturl, and confines SV2/IPC paths to /sv2/ and /bitcoin/.
  - Rental-safe Settings: removes auto-save and 2s config polling in favor of
    explicit Save (no restart) and Save & Restart Pool (with active-worker
    confirmation and gated .reload-trigger). Logs remain readable without unlocking.
  - Includes 2.1.16 low-RAM 2-container stack, code-split UI, and 3 built-in
    umbrelOS widgets (Pool Overview, Worker Best Diff Leaderboard, Hashrate Averages).
port: 5009
submitter: blockdyor
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/5938
icon: https://raw.githubusercontent.com/blockdyor/bassin/main/duckaxe-bassin/icon.svg
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_1.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_2.jpg
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bassin/gallery_3.jpg
path: ""
defaultUsername: ""
deterministicPassword: true
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
  - id: "workers-leaderboard"
    type: "list"
    refresh: "30s"
    endpoint: "ui:8080/widgets/workers"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "#1 nerdqaxe"
          subtext: "Best ever: 2.5T · 4.80 Th/s"
        - text: "#2 bitaxe-gamma"
          subtext: "Best ever: 147M · 1.20 Th/s"
        - text: "#3 bitaxe-ultra"
          subtext: "Best ever: 17.4M · 555 Gh/s"
  - id: "hashrate"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/hashrate"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "1m Avg"
          text: "2.15"
          subtext: "Th/s"
        - title: "5m Avg"
          text: "2.10"
          subtext: "Th/s"
        - title: "1h Avg"
          text: "2.05"
          subtext: "Th/s"
        - title: "24h Avg"
          text: "1.98"
          subtext: "Th/s"
