manifestVersion: 1.1
id: blockdyor-bitcoin-roots
implements:
  - bitcoin
storage:
  dataRoot: data
category: bitcoin
name: Bitcoin Roots
version: "1.4.0-roots.1-blockdyor.3"
tagline: Run your personal Bitcoin Roots node
icon: https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bitcoin-roots/icon.png
description: >-
  Validate Bitcoin with Bitcoin Roots (v30.3-roots.1), a Bitcoin Core-based node
  with selected policy and operator controls from Bitcoin Knots, paired with a
  browser interface for node settings, synchronization, and peer connections.
  Includes persistent Tor and I2P connectivity; onion connection addresses appear
  in the Connect panel after Tor starts.


  Declares Umbrel Bitcoin node compatibility (implements: bitcoin) so apps such
  as Core Lightning, Bassin, LND, and Electrs can select Bitcoin Roots as their
  Bitcoin node provider.


  Uses dedicated host ports (P2P 10333, RPC 10332, Web UI 2111) so you can
  install Bitcoin Roots alongside Bitcoin Core (8333/8332) or Bitcoin Knots
  (9333/9332), move your existing blocks/chainstate/indexes without re-syncing,
  switch dependent apps, and uninstall your previous node only after verifying
  everything works.
developer: Plan-B Foundation
website: https://plan-b.foundation/bitcoin-roots
dependencies: []
repo: https://github.com/tiero/umbrel-bitcoin-roots
support: https://github.com/tiero/umbrel-bitcoin-roots/issues
submitter: blockdyor
submission: https://github.com/blockdyor/blockdyor-umbrel-community-app-store
port: 2111
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  Moves host P2P/RPC ports to 10333/10332 (matching Bitcoin Knots' 9333/9332
  side-by-side pattern) so Bitcoin Roots installs cleanly alongside Bitcoin Core
  and Bitcoin Knots without port conflicts, enabling zero-re-sync chain data
  migration before uninstalling your old node. Keeps the Plan-B dark UI, Relay
  & Mining Policy tab, and full implements: bitcoin support for Core Lightning,
  Bassin, LND, and Electrs.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "600"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
