manifestVersion: 1.1
id: blockdyor-bitcoin-roots
implements:
  - bitcoin
storage:
  dataRoot: data
category: bitcoin
name: Bitcoin Roots
version: "32.1.0-roots.2-blockdyor.9"
tagline: Run your personal Bitcoin Roots node
icon: https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bitcoin-roots/icon.png
description: >-
  Validate Bitcoin with Bitcoin Roots (v32.1-roots.2), a Bitcoin Core-based node
  with selected policy and operator controls from Bitcoin Knots, paired with a
  browser interface for node settings, synchronization, and peer connections.
  Includes persistent Tor and I2P connectivity; onion connection addresses appear
  in the Connect panel after Tor starts.


  Declares Umbrel Bitcoin node compatibility (implements: bitcoin) so apps such
  as Core Lightning, Bassin, LND, and Electrs can select Bitcoin Roots as their
  Bitcoin node provider.


  Uses standard Bitcoin ports (P2P 8333, RPC 8332) for full DNS-seed clearnet
  peer discovery, with a dedicated Web UI port (2111). If migrating from
  Bitcoin Core (8333/8332), stop Bitcoin Core before installing Bitcoin Roots,
  move your existing blocks/chainstate/indexes without re-syncing, switch
  dependent apps, and uninstall your previous node only after verifying
  everything works. Bitcoin Knots uses 9333/9332 and does not collide.

  The home screenshot illustrates completed sync; its sync status and block heights were edited for the gallery.

developer: Plan-B Foundation
website: https://plan-b.foundation/bitcoin-roots
dependencies: []
repo: https://github.com/tiero/umbrel-bitcoin-roots
support: https://github.com/tiero/umbrel-bitcoin-roots/issues
submitter: blockdyor
submission: https://github.com/blockdyor/blockdyor-umbrel-community-app-store
port: 2111
gallery:
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bitcoin-roots/gallery_1.png
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bitcoin-roots/gallery_2.png
  - https://raw.githubusercontent.com/blockdyor/blockdyor-umbrel-community-app-store/master/blockdyor-bitcoin-roots/gallery_3.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Full-app line-by-line leak hardening (21 backend and frontend fixes, 0
  SonarCloud issues/hotspots): fixes startup ZMQ subscriber socket leaks,
  serializes heavy verbosity-2 getblock fetches with in-flight deduplication
  and empty-block caching to prevent V8 heap spikes, fixes bitcoind spawn-error
  deadlock and idempotent graceful shutdown (closing Fastify, ZMQ, heartbeat
  timer, and GeoIP FDs); fixes Globe WebGLRenderer/EffectComposer/OrbitControls
  document-listener and arc leaks on unmount, eliminates per-render Sphere
  allocations and 60fps Vector3 churn, disposes AnimatedCube liquidMaterial,
  stops the 2-second useSyncStatus re-render storm across Home/Layout/Insights,
  removes 250 per-row ResizeObservers in PeersTable, and fixes uncancelled
  timers in Scene, Settings, and ConnectionDetails.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "600"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
